name: Build Folium iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Redirect Repositories & Clear Locks
        run: |
          # Remove SPM lockfiles to force clean resolution
          rm -f Folium.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          find . -name "Package.resolved" -delete
          
          # Redirect top-level project dependencies to your forks
          find . -name "project.pbxproj" -exec sed -i '' 's|https://github.com/jarrodnorwell/|https://github.com/lapnguyenngo12092010-eng/|g' {} +

      - name: Resolve SPM & Patch Transitive Dependencies (PLzmaSDK)
        run: |
          # Step A: Fetch all packages into the build directory with scheme specified
          xcodebuild -resolvePackageDependencies \
            -project "Folium.xcodeproj" \
            -scheme "Folium" \
            -derivedDataPath build || true

          # Step B: Ensure directory exists, then strip problematic resource lines from checked-out manifests
          if [ -d "build/SourcePackages/checkouts" ]; then
            find build/SourcePackages/checkouts -name "Package.swift" -type f -exec sed -i '' '/PrivacyInfo.xcprivacy/d' {} +
            find build/SourcePackages/checkouts -name "Package.swift" -type f -exec sed -i '' 's/swift-tools-version:.*/swift-tools-version:6.0/g' {} +
            
            # Step C: Physically delete PrivacyInfo and Markdown files from checkouts
            find build/SourcePackages/checkouts -name "PrivacyInfo.xcprivacy" -delete 2>/dev/null || true
            find build/SourcePackages/checkouts -name "*.md" -delete 2>/dev/null || true
          fi

      - name: Build Folium App
        run: |
          xcodebuild build \
            -project "Folium.xcodeproj" \
            -scheme "Folium" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++17" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) _CRT_SECURE_NO_WARNINGS=1' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="-Wno-everything" \
            OTHER_CPLUSPLUSFLAGS="-Wno-everything -std=gnu++17" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Folium.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folium-iOS-IPA
          path: Folium.ipa
