name: Build Folium iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version with Swift 6.2+ Support
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Resolve Swift Package Dependencies
        run: |
          PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          xcodebuild -resolvePackageDependencies -project "$PROJ_PATH"

      - name: Build Folium Scheme
        run: |
          PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "Folium" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++17" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) _CRT_SECURE_NO_WARNINGS=1' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="-Wno-everything" \
            OTHER_CPLUSPLUSFLAGS="-Wno-everything -std=gnu++17" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Folium.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folium-iOS-IPA
          path: Folium.ipa
