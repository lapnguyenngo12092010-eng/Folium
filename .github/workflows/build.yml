name: Build Folium iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Build Folium Main App Scheme
        run: |
          PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          
          # Target 'Folium' scheme directly to avoid building Cherry/Switch sub-cores
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "Folium" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Folium.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folium-iOS-IPA
          path: Folium.ipa
