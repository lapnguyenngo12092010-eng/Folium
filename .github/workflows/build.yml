name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  build-ios:
    runs-on: macos-14 # GitHub-managed Mac runner with Xcode pre-installed
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install dependencies via Homebrew
        run: |
          brew install xcodegen cmake ninja ccache

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r 3DS_Emulator.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Emulator-IPA
          path: 3DS_Emulator.ipa
