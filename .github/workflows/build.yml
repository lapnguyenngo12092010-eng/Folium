name: Build Folium iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Downgrade Swift Tools Requirements
        run: |
          # Patch local package manifests to accept Swift 6.1 / 6.0
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version:.*/swift-tools-version:6.0/g' {} +
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} +

      - name: Resolve Dependencies & Build
        run: |
          PROJ_PATH=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)

          # Fetch dependencies
          xcodebuild -resolvePackageDependencies -project "$PROJ_PATH" || true

          # Patch any checked out external dependencies (like AntiqueKit) inside DerivedData & SPM Caches
          find ~/Library/Caches/org.swift.swiftpm/repositories -name "Package.swift" -exec sed -i '' 's/swift-tools-version:.*/swift-tools-version:6.0/g' {} + 2>/dev/null || true
          find ~/Library/Developer/Xcode/DerivedData -name "Package.swift" -exec sed -i '' 's/swift-tools-version:.*/swift-tools-version:6.0/g' {} + 2>/dev/null || true

          # Final build pass
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "Folium" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CLANG_CXX_LANGUAGE_STANDARD="gnu++17" \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) _CRT_SECURE_NO_WARNINGS=1' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="-Wno-everything" \
            OTHER_CPLUSPLUSFLAGS="-Wno-everything -std=gnu++17" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Folium.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folium-iOS-IPA
          path: Folium.ipa
